plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreFile = System.getenv("MILKISHOP_KEYSTORE_FILE")

android {
    namespace 'com.milki.shop'
    compileSdk 35

    defaultConfig {
        applicationId 'com.milki.shop'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (keystoreFile != null) {
                storeFile file(keystoreFile)
                storePassword System.getenv("MILKISHOP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MILKISHOP_KEY_ALIAS")
                keyPassword System.getenv("MILKISHOP_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
