name: Build MILKISHOP Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MILKISHOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/milkishop-release.jks"
          test -s "$RUNNER_TEMP/milkishop-release.jks"

      - name: Build signed Release APK
        env:
          MILKISHOP_KEYSTORE_FILE: ${{ runner.temp }}/milkishop-release.jks
          MILKISHOP_KEYSTORE_PASSWORD: ${{ secrets.MILKISHOP_KEYSTORE_PASSWORD }}
          MILKISHOP_KEY_ALIAS: ${{ secrets.MILKISHOP_KEY_ALIAS }}
        run: |
          test -n "$MILKISHOP_KEYSTORE_PASSWORD"
          test -n "$MILKISHOP_KEY_ALIAS"
          gradle assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MILKISHOP-Release-APK-v1.5
          path: app/build/outputs/apk/release/app-release.apk
